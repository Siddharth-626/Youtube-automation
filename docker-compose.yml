version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongodb
      - ffmpeg
  mongodb:
    image: mongo:7
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  ffmpeg:
    image: jrottenberg/ffmpeg:6.1-alpine
    command: ["-version"]

volumes:
  mongo_data:
